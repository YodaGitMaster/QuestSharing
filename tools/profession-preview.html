<div id="profession-redesign" class="viz-dotted-background" role="region" aria-label="WoW profession window layout preview with illustrative learned recipes">
<style>
#profession-redesign{--wow-bg:#18140e;--wow-edge:#776345;--wow-text:#eee5d3;--wow-gold:#f4cb6a;--wow-muted:#b9b4aa;--wow-missing:#aaa9a5;color:var(--wow-text);font-family:Georgia,"Times New Roman",serif;padding:8px 0}
#profession-redesign *{box-sizing:border-box}
#profession-redesign .wow-window{background:var(--wow-bg);border:3px ridge var(--wow-edge);border-radius:7px;box-shadow:0 8px 20px #0005;max-width:782px;margin:0 auto}
#profession-redesign .wow-heading{display:flex;align-items:center;gap:16px;padding:13px 20px 10px;background:linear-gradient(#3b3224,#201a12);border-bottom:2px ridge var(--wow-edge)}
#profession-redesign .wow-heading h2{font-size:20px;color:var(--wow-gold);margin:0;font-weight:500}
#profession-redesign .wow-rank{display:flex;gap:8px;align-items:center;margin-left:auto;font:13px Arial,sans-serif;color:var(--wow-text)}
#profession-redesign .wow-rank progress{width:120px;height:12px;accent-color:#749e38}
#profession-redesign .wow-body{display:grid;grid-template-columns:minmax(245px,40%) minmax(0,1fr);min-height:504px}
#profession-redesign .wow-list{border-right:1px solid #665337;padding:12px 8px 0;background:#16130d;min-width:0}
#profession-redesign input{width:100%;background:#0b0907;border:1px solid #706041;border-radius:3px;color:var(--wow-text);padding:7px 10px;font:14px Arial,sans-serif}
#profession-redesign .wow-count{font:12px Arial,sans-serif;color:var(--wow-muted);margin:12px 4px}
#profession-redesign .wow-columns{display:flex;justify-content:space-between;font:13px Arial,sans-serif;color:var(--wow-gold);padding:0 6px 7px}
#profession-redesign .wow-recipes{height:410px;overflow-y:auto;scrollbar-color:#80704c #19140e;scrollbar-width:thin}
#profession-redesign button{font-family:Arial,sans-serif;cursor:pointer}
#profession-redesign .wow-recipe{width:100%;display:grid;grid-template-columns:minmax(0,1fr) 36px;column-gap:7px;text-align:left;padding:6px;min-height:44px;border:0;border-radius:0;background:transparent;color:var(--wow-missing);font-size:14px;line-height:18px}
#profession-redesign .wow-recipe:hover{background:#3b2c17}
#profession-redesign .wow-recipe[aria-selected=true]{background:#4c391b;box-shadow:inset 2px 0 #d1a64f}
#profession-redesign .wow-recipe.known{color:var(--wow-gold)}
#profession-redesign .wow-recipe .wow-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#profession-redesign .wow-skill{text-align:right;font-variant-numeric:tabular-nums}
#profession-redesign .wow-recipe small{grid-column:1 / -1;color:var(--wow-muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#profession-redesign .wow-detail{min-width:0;padding:22px 22px 18px;background:radial-gradient(at top right,#30271a,transparent 80%);font:14px/1.55 Arial,sans-serif}
#profession-redesign .wow-detail h3{font:500 21px/1.3 Georgia,serif;margin:0 0 12px;color:var(--wow-gold)}
#profession-redesign .wow-detail h4{font:500 16px Georgia,serif;color:var(--wow-gold);margin:23px 0 10px}
#profession-redesign .wow-state{color:var(--wow-muted);margin-bottom:14px}
#profession-redesign .wow-detail p{margin:0 0 14px;overflow-wrap:anywhere}
#profession-redesign .wow-requirement{color:var(--wow-gold)}
#profession-redesign .wow-ingredient{display:block;width:100%;padding:10px 8px;margin:3px 0;background:#292217;color:var(--wow-text);border:1px solid #5e4b2e;border-radius:2px;text-align:left;font-size:14px}
#profession-redesign .wow-farm{font-size:13px;margin-top:12px;padding-top:12px;border-top:1px solid #615034}
#profession-redesign .wow-craft{padding:8px 28px;background:linear-gradient(#8d2525,#4a1010);color:var(--wow-gold);border:2px ridge #9e8046;border-radius:3px;font-size:14px;margin-top:22px}
#profession-redesign .wow-tabs{display:flex;gap:3px;padding:0 12px;background:#211a11;border-top:1px solid #6d593b}
#profession-redesign .wow-tabs button{padding:10px 18px;background:#302719;color:var(--wow-muted);border:1px solid #776345;border-top:0;font-size:14px}
#profession-redesign .wow-tabs button[aria-selected=true]{background:#4a3820;color:var(--wow-gold)}
#profession-redesign .wow-upgrades{padding:16px;display:grid;grid-template-columns:170px minmax(0,1fr);gap:18px;min-height:504px;font:14px/1.5 Arial,sans-serif}
#profession-redesign [hidden]{display:none!important}
#profession-redesign .wow-professions button,#profession-redesign .wow-factions button{background:transparent;color:var(--wow-text);border:1px solid transparent;text-align:left;padding:7px 10px;font-size:14px}
#profession-redesign .wow-professions button{display:block;width:100%}
#profession-redesign .wow-professions button[aria-selected=true],#profession-redesign .wow-factions button[aria-selected=true]{background:#4a3820;border-color:#80633b;color:var(--wow-gold)}
#profession-redesign .wow-upgrades h3{font:500 20px Georgia,serif;color:var(--wow-gold);margin:0 0 12px}
#profession-redesign .wow-training{height:397px;overflow-y:auto;scrollbar-color:#80704c #19140e;padding-right:8px}
#profession-redesign .wow-training h4{color:var(--wow-gold);font-size:15px;font-weight:500;margin:20px 0 7px}
#profession-redesign .wow-training p{margin:6px 0 10px}
#profession-redesign .wow-preview-note{font:12px Arial,sans-serif;color:#8d8a83;text-align:center;margin:12px 0 0}
@media(max-width:550px){#profession-redesign .wow-body{grid-template-columns:1fr}#profession-redesign .wow-list{border-right:0;border-bottom:1px solid var(--wow-edge)}#profession-redesign .wow-recipes{height:224px}#profession-redesign .wow-rank progress{display:none}#profession-redesign .wow-upgrades{grid-template-columns:1fr}#profession-redesign .wow-professions{display:flex;flex-wrap:wrap}#profession-redesign .wow-professions button{width:auto}#profession-redesign .wow-heading{gap:4px;padding:12px}#profession-redesign .wow-detail{padding:18px}}
</style>
<section class="wow-window" aria-label="Existing WoW Cooking profession window">
<header class="wow-heading"><h2>Cooking</h2><div class="wow-rank"><span>46 / 75</span><progress value="46" max="75" aria-label="Illustrative Cooking skill 46 out of 75"></progress></div></header>
<div class="wow-body" data-view="recipes"><div class="wow-list"><input type="search" aria-label="Search all Cooking recipes" placeholder="Search recipes..." autocomplete="off"><div class="wow-count"></div><div class="wow-columns"><span>Recipe</span><span>Skill</span></div><div class="wow-recipes" role="listbox" aria-label="All recipes; unlearned recipes are gray"></div></div><section class="wow-detail" aria-live="polite"></section></div>
<div class="wow-upgrades" data-view="upgrades" hidden><nav class="wow-professions" aria-label="Profession"></nav><section><h3></h3><div class="wow-factions" aria-label="Faction"></div><div class="wow-training"></div></section></div>
<nav class="wow-tabs" aria-label="Profession views"><button data-tab="recipes" aria-selected="true">Recipes</button><button data-tab="upgrades" aria-selected="false">Upgrades</button></nav>
</section><div class="wow-preview-note">Layout preview · illustrative learned states · native game rendering still needs testing</div>
<script type="application/json" id="profession-preview-data">__PROFESSION_DATA__</script>
<script>
(()=>{const root=document.getElementById('profession-redesign');const data=JSON.parse(root.querySelector('#profession-preview-data').textContent);const list=root.querySelector('.wow-recipes'),detail=root.querySelector('.wow-detail');let selected=data.recipes.find(r=>r.id===7752)||data.recipes[0],profession=data.professions.find(p=>p.name==='Cooking'),side='Both';const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const persist=()=>{if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{recipe:selected.name,profession:profession.name,faction:side},privateContent:null}).catch(()=>{})};function rows(){const q=root.querySelector('input').value.toLowerCase(),items=data.recipes.filter(r=>(r.name+' '+r.shortSource+' '+r.ingredients.map(i=>i.name).join(' ')).toLowerCase().includes(q));root.querySelector('.wow-count').textContent=items.length+' recipes · '+items.filter(r=>r.known).length+' learned';list.replaceChildren();for(const r of items){const b=document.createElement('button');b.className='wow-recipe'+(r.known?' known':'');b.setAttribute('role','option');b.setAttribute('aria-selected',r===selected);b.innerHTML='<span class="wow-name">'+escape(r.name)+'</span><span class="wow-skill">'+escape(r.skill??'?')+'</span><small>'+escape(r.shortSource)+'</small>';b.onclick=()=>{selected=r;rows();pane();persist()};list.appendChild(b)}}function pane(){detail.innerHTML='<h3>'+escape(selected.name)+'</h3><div class="wow-state">'+(selected.known?'Learned · native crafting pane':'Not learned')+'</div><p class="wow-requirement">Requires Cooking '+escape(selected.skill??'?')+'</p><h4>'+(selected.known?'Recipe source':'Where to learn')+'</h4>'+selected.sources.map(s=>'<p>'+escape(s)+'</p>').join('')+'<h4>Ingredients</h4><div class="wow-reagents"></div><div class="wow-farm" hidden></div>'+(selected.known?'<button class="wow-craft" disabled aria-label="Native Create button, preview only">Create</button>':'');for(const i of selected.ingredients){const b=document.createElement('button');b.className='wow-ingredient';b.textContent=i.count+' × '+i.name;b.onmouseenter=b.onfocus=b.onclick=()=>{const f=detail.querySelector('.wow-farm');f.hidden=false;f.textContent=i.farm.join(' ')};detail.querySelector('.wow-reagents').appendChild(b)}}function upgrades(){root.querySelector('.wow-upgrades h3').textContent=profession.name+' — training';const ps=root.querySelector('.wow-professions');ps.replaceChildren();for(const p of data.professions){const b=document.createElement('button');b.textContent=p.name;b.setAttribute('aria-selected',profession===p);b.onclick=()=>{profession=p;upgrades();persist()};ps.appendChild(b)}const fs=root.querySelector('.wow-factions');fs.replaceChildren();for(const f of ['Both','Alliance','Horde']){const b=document.createElement('button');b.textContent=f;b.setAttribute('aria-selected',f===side);b.onclick=()=>{side=f;upgrades();persist()};fs.appendChild(b)}root.querySelector('.wow-training').innerHTML=profession.ranks.map(r=>'<h4>'+escape(r.name)+' · maximum '+r.cap+'</h4><p>Requires '+escape(profession.name)+' '+r.skill+(r.level?' and character level '+r.level:'')+'</p><p>'+escape(r.method)+'</p>'+['Alliance','Horde'].filter(f=>side==='Both'||side===f).map(f=>'<p>'+f+': '+escape(r[f])+'</p>').join('')).join('')}root.querySelector('input').addEventListener('input',rows);for(const b of root.querySelectorAll('[data-tab]'))b.onclick=()=>{for(const t of root.querySelectorAll('[data-tab]'))t.setAttribute('aria-selected',t===b);for(const p of root.querySelectorAll('[data-view]'))p.hidden=p.dataset.view!==b.dataset.tab;persist()};rows();pane();upgrades();})();
</script>
</div>
